name: Remove basket version blocks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-basket-version-blocks.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove two version blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          blocks = [
          '''{
title: "Bez kosza",
text: "Wersja kompaktowa ze stałą osłoną z siatki stalowej zintegrowaną z ramą maszyny.",
},
''',
          '''{
title: "Z koszem roboczym",
text: "Większa wygoda pracy, łatwiejsze ustawianie krótszych polan i lepsza organizacja stanowiska.",
},
'''
          ]
          for block in blocks:
              if block not in s:
                  raise SystemExit(f'Block not found: {block}')
              s = s.replace(block, '', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove Bez kosza and Z koszem roboczym blocks"
          git push
