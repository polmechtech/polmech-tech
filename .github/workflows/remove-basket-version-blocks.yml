name: Remove basket version blocks

on:
  push:
    paths:
      - '.github/workflows/remove-basket-version-blocks.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove two version blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/page.tsx")
          s = p.read_text()
          start = s.index('const versions = [')
          end = s.index('];', start)
          section = s[start:end]
          import re
          section = re.sub(r'\{\s*title: "Bez kosza",\s*text: "[^"]*",\s*\},\s*', '', section)
          section = re.sub(r'\{\s*title: "Z koszem roboczym",\s*text: "[^"]*",\s*\},\s*', '', section)
          s = s[:start] + section + s[end:]
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove Bez kosza and Z koszem roboczym blocks"
          git push
